{% extends 'admin_app/master.html' %}
{% load static %}
{% block content %}

  <main id="main" class="main">

    <div class="pagetitle">
      <h1>Susbcribe Data Tables</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'admin_app:index' %}">Home</a></li>
          <li class="breadcrumb-item">Tables</li>
          <li class="breadcrumb-item active">General</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-12">

          <div class="card">
            <div class="card-body">

              <!-- Default Table -->
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Your Email</th>
                    <th scope="col">Created On</th>
                  </tr>
                </thead>
                <tbody>
                    {% for s in subscribe %}
                  <tr>
                    <th scope="row">{{ forloop.counter }}</th>
                    <th scope="row">{{ s.email }}</th>
                    <th scope="row">{{ s.created_at }}</th>
                  </tr>
                    {% endfor %}
                </tbody>
              </table>
              <!-- End small tables -->

            </div>
          </div>

        </div>
      </div>
    </section>

  </main><!-- End #main -->

{% endblock %}
