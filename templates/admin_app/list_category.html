{% extends 'admin_app/master.html' %}
{% load static %}
{% block content %}

  <main id="main" class="main">

    <div class="pagetitle">
      <h1>Category Data Tables</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'index_view' %}">Home</a></li>
          <li class="breadcrumb-item">Tables</li>
          <li class="breadcrumb-item active">General</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-7">

          <div class="card">
            <div class="card-body">

              <div class="d-flex gap-2">
                <!-- Add Category Button -->
                <a href="{% url 'admin_app:add_category_view' %}" class="btn btn-primary">
                  + Add Category
                </a>
              </div>

              <!-- Default Table -->
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Category Name</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody>
                    {% for c in category %}
                  <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{ c.name }}</td>
                    <td>
                      <a href="{% url 'admin_app:update_category_view' c.id %}" class="btn btn-sm btn-warning">Update</a>

                      <a href="{% url 'admin_app:delete_category_view' c.id %}" class="btn btn-sm btn-danger" 
                        onclick="return confirm('Are you sure you want to delete this category?');">Delete</a>
                    </td>
                  </tr>
                    {% endfor %}
                </tbody>
              </table>
              <!-- End small tables -->

            </div>
          </div>

        </div>
      </div>
    </section>

  </main><!-- End #main -->

{% endblock %}
